# Copy to your plugin config dir (herdr plugin config-dir dnzzl.automations)
# as automations.yaml — or let `herdr-automations add` write it for you.

# How many runs may be in flight at once. Automations sharing an occurrence
# queue instead of starting a fleet of agents in the same second.
max_concurrent: 2

automations:
  - name: issue-triage
    cron: "0 9 * * 1-5"
    repo: ~/Projects/myapp
    workspace: worktree
    agent: claude
    prompt: |
      Triage new GitHub issues: label them, close duplicates,
      draft replies for the ones needing more info.
    mcp_config: ~/.config/mcp/github.json
    timeout_minutes: 45
    # Its tab stays up until the next weekday morning, then gets replaced.
    keep: 1
    keep_failed: 3
    # If the machine was asleep at 09:00, run on wake — but only within 2h.
    catch_up_minutes: 120

  - name: nightly-deps
    cron: "@daily"
    repo: ~/Projects/myapp
    workflow: bump-dependencies   # delegated to herdr-workflows: hwf run bump-dependencies
    disabled: true

  # Runs at 03:00 on 20 August and then retires itself — no edit needed after.
  # A failed attempt doesn't count, so with this cron the retry is next year:
  # use @daily if you would rather it try again tomorrow.
  - name: one-off-migration
    cron: "0 3 20 8 *"
    once: true
    repo: ~/Projects/myapp
    workspace: root
    prompt: Run the data migration in docs/migrations/2026-08-batch.md.
    env:
      # Exported into the pane's shell before the agent starts.
      MCP_TIMEOUT: "60000"
    timeout_minutes: 90
